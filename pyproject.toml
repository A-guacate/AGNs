[project]
authors = [{name = "William Alexander Pacheco Valderrama", email = "wpachecov@unal.edu.co"}]
dependencies = []
name = "AGNs"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
agns = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = ">=2.4.6,<3"
jupyterlab = ">=4.5.7,<5"
matplotlib = ">=3.10.9,<4"
pandas = ">=3.0.3,<4"
scipy = ">=1.17.1,<2"
